[project]
name = "ai-analyst-backend"
version = "0.1.0"
description = "AI Business Analyst Platform backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "redis",
    "celery",
    "structlog",
    "duckdb",
    "pandas",
    "pyarrow",
    "pyjwt>=2.15.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1.5",
    "sqlglot>=30.23.0",
    "charset-normalizer>=3.5.2",
    "statsmodels>=0.15.0",
    "statsforecast>=2.0.3",
    "lightgbm>=4.7.0",
    "mlflow-skinny==2.22.0",
    "psutil>=7.2.2",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "pre-commit",
    "pyyaml",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501"]
"alembic/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "pandas.*", "pyarrow.*", "duckdb.*", "openpyxl.*", "sqlglot.*", "yaml.*", "statsmodels.*", "scipy.*", "statsforecast.*", "lightgbm.*", "mlflow.*", "numpy.*", "psutil.*", "numba.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.tasks", "app.workers.celery_app"]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes 10s or more locally (large files or several full analysis runs); still part of make test and CI"]
filterwarnings = [
    "ignore::SyntaxWarning",
    "ignore::DeprecationWarning:mlflow.*",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::pydantic.warnings.PydanticDeprecatedSince212",
]
