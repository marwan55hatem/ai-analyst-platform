x-backend: &backend
  build:
    context: ./backend
  image: ai-analyst-backend:dev
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://analyst:analyst@postgres:5432/analyst
    REDIS_URL: redis://redis:6379/0
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_HTTP_REQUEST_TIMEOUT: "3"
    MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"
    FORECAST_MAX_SECONDS: ${FORECAST_MAX_SECONDS:-60}
    FORECAST_MAX_SERIES: ${FORECAST_MAX_SERIES:-11}
    FORECAST_MAX_HORIZON: ${FORECAST_MAX_HORIZON:-24}
    FORECAST_MAX_GROUPS: ${FORECAST_MAX_GROUPS:-10}
    FORECAST_MEMORY_MB: ${FORECAST_MEMORY_MB:-850}
    FORECAST_SEED: ${FORECAST_SEED:-42}
    ML_SEED: ${ML_SEED:-42}
    ANOMALY_ROW_SAMPLE: ${ANOMALY_ROW_SAMPLE:-50000}
    ANOMALY_MAX_SECONDS: ${ANOMALY_MAX_SECONDS:-60}
    SEGMENT_MAX_SECONDS: ${SEGMENT_MAX_SECONDS:-60}
    SEGMENT_MAX_CUSTOMERS: ${SEGMENT_MAX_CUSTOMERS:-100000}
    SEGMENT_BOOTSTRAP_ROUNDS: ${SEGMENT_BOOTSTRAP_ROUNDS:-20}
    CHURN_MAX_CUSTOMERS: ${CHURN_MAX_CUSTOMERS:-200000}
    CHURN_MAX_SECONDS: ${CHURN_MAX_SECONDS:-60}
    DRIVER_MAX_ROWS: ${DRIVER_MAX_ROWS:-50000}
    DRIVER_SHAP_ROWS: ${DRIVER_SHAP_ROWS:-2000}
    DRIVER_MAX_SECONDS: ${DRIVER_MAX_SECONDS:-60}
    WHATIF_MAX_CONCURRENT: ${WHATIF_MAX_CONCURRENT:-2}
    PSEUDONYM_SECRET: ${PSEUDONYM_SECRET:-}
    NUMBA_CACHE_DIR: /tmp/numba_cache
    JWT_SECRET: ${JWT_SECRET:-change-me}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    STORAGE_DIR: /app/storage
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    MAX_ROWS: ${MAX_ROWS:-2000000}
    QUERY_MEMORY_MB: ${QUERY_MEMORY_MB:-256}
    QUERY_THREADS: ${QUERY_THREADS:-2}
    PROFILE_MEMORY_MB: ${PROFILE_MEMORY_MB:-256}
    ANALYSIS_MEMORY_MB: ${ANALYSIS_MEMORY_MB:-256}
    AUTO_ANALYZE: ${AUTO_ANALYZE:-true}
    QUERY_TIMEOUT_S: ${QUERY_TIMEOUT_S:-30}
    INGEST_STUCK_MINUTES: ${INGEST_STUCK_MINUTES:-30}
    # Step 8 agent. Shell variables win over .env, so `LLM_PROVIDER=fake make up` uses the fake model.
    APP_ENV: ${APP_ENV:-development}
    LLM_PROVIDER: ${LLM_PROVIDER:-none}
    LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
    LLM_MODEL_STRONG: ${LLM_MODEL_STRONG:-deepseek-v4-pro}
    LLM_THINKING: ${LLM_THINKING:-enabled}
    LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-120}
    LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
    LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
    LLM_PRICE_INPUT_PER_M: ${LLM_PRICE_INPUT_PER_M:-0.44}
    LLM_PRICE_CACHED_INPUT_PER_M: ${LLM_PRICE_CACHED_INPUT_PER_M:-0.014}
    LLM_PRICE_OUTPUT_PER_M: ${LLM_PRICE_OUTPUT_PER_M:-1.32}
    LLM_PRICE_STRONG_INPUT_PER_M: ${LLM_PRICE_STRONG_INPUT_PER_M:-1.32}
    LLM_PRICE_STRONG_CACHED_INPUT_PER_M: ${LLM_PRICE_STRONG_CACHED_INPUT_PER_M:-0.044}
    LLM_PRICE_STRONG_OUTPUT_PER_M: ${LLM_PRICE_STRONG_OUTPUT_PER_M:-3.96}
    AGENT_DAILY_TOKEN_BUDGET: ${AGENT_DAILY_TOKEN_BUDGET:-200000}
    AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-8}
    AGENT_HISTORY_MESSAGES: ${AGENT_HISTORY_MESSAGES:-12}
    AGENT_SUMMARY_AFTER: ${AGENT_SUMMARY_AFTER:-16}
    AGENT_TOOL_OUTPUT_CHARS: ${AGENT_TOOL_OUTPUT_CHARS:-12000}
    CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-20}
    CHAT_MAX_CONCURRENT_STREAMS: ${CHAT_MAX_CONCURRENT_STREAMS:-2}
    SANDBOX_URL: unix:///ipc/sandbox.sock
    SANDBOX_TIMEOUT_S: ${SANDBOX_TIMEOUT_S:-15}
    SANDBOX_MAX_UPLOAD_MB: ${SANDBOX_MAX_UPLOAD_MB:-20}
  # The API saves uploads and the worker converts them: both must see the same files.
  volumes:
    - storage:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: analyst
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d analyst"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

  api:
    <<: *backend
    ports:
      - "8000:8000"
    # storage for datasets plus the sandbox socket (the ipc volume holds nothing else)
    volumes:
      - storage:/app/storage
      - sandbox-ipc:/ipc
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 768m

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    mem_limit: 1024m

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    mem_limit: 256m

  # run_python sandbox: no network at all, no storage volume, read-only root, non-root user.
  # The api reaches it only through the unix socket on the sandbox-ipc volume.
  sandbox:
    build:
      context: ./sandbox
    image: ai-analyst-sandbox:dev
    network_mode: none
    read_only: true
    user: "10001:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - sandbox-ipc:/ipc
    environment:
      SANDBOX_LISTEN: unix:/ipc/sandbox.sock
      SANDBOX_TIMEOUT_S: ${SANDBOX_TIMEOUT_S:-15}
      SANDBOX_CHILD_MEMORY_MB: ${SANDBOX_CHILD_MEMORY_MB:-400}
      SANDBOX_MAX_REQUEST_MB: ${SANDBOX_MAX_REQUEST_MB:-40}
    healthcheck:
      test: ["CMD", "python", "-I", "-m", "sandbox_server.healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64

  # CI and walkthrough proof that the socket works with no network: runs only with --profile ci.
  sandbox-check:
    image: python:3.12-slim
    profiles: ["ci"]
    network_mode: none
    read_only: true
    user: "1000:1000"
    volumes:
      - sandbox-ipc:/ipc
      - ./sandbox/smoke_check.py:/check/smoke_check.py:ro
    command: ["python", "-I", "/check/smoke_check.py"]
    depends_on:
      sandbox:
        condition: service_healthy

  # The container layer alone: the sandbox image and runtime flags, but raw Python instead of the
  # sandbox server, so no static check, audit hook or rlimit is involved. Runs only with --profile ci.
  sandbox-container-check:
    image: ai-analyst-sandbox:dev
    profiles: ["ci"]
    network_mode: none
    read_only: true
    user: "10001:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./sandbox/container_check.py:/check/container_check.py:ro
    command: ["python", "-I", "/check/container_check.py"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 64

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--serve-artifacts", "--artifacts-destination", "/mlflow/artifacts", "--default-artifact-root", "mlflow-artifacts:/"]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 512m

  # Next.js frontend. The browser talks only to this origin; /api/v1/* is rewritten to the
  # api service, so no CORS is needed. Rewrites and NEXT_PUBLIC_ values are fixed at build
  # time, hence build args; the upload limit shown to users comes from the same
  # MAX_UPLOAD_MB the api enforces. For development run `npm run dev` on the host instead.
  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://api:8000
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Analyst}
        NEXT_PUBLIC_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    image: ai-analyst-frontend:dev
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 384m

volumes:
  pgdata:
  mlflow-data:
  storage:
  sandbox-ipc:
