x-backend: &backend
  build:
    context: ./backend
  image: ai-analyst-backend:dev
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://analyst:analyst@postgres:5432/analyst
    REDIS_URL: redis://redis:6379/0
    MLFLOW_TRACKING_URI: http://mlflow:5000
    JWT_SECRET: ${JWT_SECRET:-change-me}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    STORAGE_DIR: /app/storage
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    MAX_ROWS: ${MAX_ROWS:-2000000}
    QUERY_MEMORY_MB: ${QUERY_MEMORY_MB:-256}
    QUERY_THREADS: ${QUERY_THREADS:-2}
    PROFILE_MEMORY_MB: ${PROFILE_MEMORY_MB:-256}
    QUERY_TIMEOUT_S: ${QUERY_TIMEOUT_S:-30}
    INGEST_STUCK_MINUTES: ${INGEST_STUCK_MINUTES:-30}
  # The API saves uploads and the worker converts them: both must see the same files.
  volumes:
    - storage:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: analyst
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d analyst"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

  api:
    <<: *backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 768m

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    mem_limit: 768m

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    mem_limit: 256m

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--default-artifact-root", "/mlflow/artifacts"]
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 512m

volumes:
  pgdata:
  mlflow-data:
  storage:
